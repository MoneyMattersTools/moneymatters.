<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advisor Review Requests — Internal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px;
    background: #14181a;
    color: #e6e9ea;
    font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: #8a9296; margin: 0 0 20px; font-size: 13px; }

  #login-panel { max-width: 320px; margin-top: 60px; }
  #login-panel input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: #1e2427; border: 1px solid #333c40; border-radius: 6px;
    color: #e6e9ea; font-size: 14px;
  }
  #login-panel button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 6px;
    background: #3ba676; color: #0e1210; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #login-error { color: #e0796a; font-size: 13px; margin-top: 8px; min-height: 18px; }

  #app { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid #262c2f;
    vertical-align: top;
  }
  th { color: #8a9296; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  td { font-size: 13.5px; }
  .col-date { white-space: nowrap; color: #a4acb0; }
  .col-email { white-space: nowrap; }
  .col-notes { max-width: 420px; }
  .col-notes ul { margin: 0 0 6px; padding-left: 18px; }
  .col-notes .freetext { color: #b7bec1; white-space: pre-wrap; }
  .col-notes .empty { color: #5c6468; font-style: italic; }
  select {
    background: #1e2427; color: #e6e9ea; border: 1px solid #333c40;
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .save-flash { margin-left: 8px; font-size: 12px; }
  .save-flash.ok { color: #3ba676; }
  .save-flash.err { color: #e0796a; }
  #status-line { color: #8a9296; margin-bottom: 12px; font-size: 13px; }
  #refresh-btn {
    background: none; border: 1px solid #333c40; color: #e6e9ea;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="login-panel">
  <h1>Advisor Review Requests</h1>
  <p class="subtitle">Internal only.</p>
  <input type="password" id="admin-password" placeholder="Admin password" autocomplete="off">
  <button type="button" id="login-btn">Unlock</button>
  <p id="login-error"></p>
</div>

<div id="app">
  <h1>Advisor Review Requests</h1>
  <p class="subtitle">Internal only — not customer-facing.</p>
  <button type="button" id="refresh-btn">Refresh</button>
  <p id="status-line"></p>
  <table>
    <thead>
      <tr>
        <th class="col-date">Submitted</th>
        <th class="col-email">Email</th>
        <th class="col-notes">What they need / notes</th>
        <th>Location</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
(function () {
  var STATUSES = ['Requested', 'Matched', 'Meeting Taken'];
  var pw = '';
  try { pw = sessionStorage.getItem('mm_admin_pw') || ''; } catch (e) {}

  var loginPanel = document.getElementById('login-panel');
  var app = document.getElementById('app');
  var loginError = document.getElementById('login-error');
  var statusLine = document.getElementById('status-line');
  var rowsEl = document.getElementById('rows');

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderNotes(row) {
    var parts = [];
    if (Array.isArray(row.situational_details) && row.situational_details.length) {
      parts.push('<ul>' + row.situational_details.map(function (s) {
        return '<li>' + escapeHtml(s) + '</li>';
      }).join('') + '</ul>');
    }
    if (row.details) {
      parts.push('<div class="freetext">' + escapeHtml(row.details) + '</div>');
    }
    return parts.length ? parts.join('') : '<span class="empty">Nothing submitted</span>';
  }

  function renderRows(requests) {
    rowsEl.innerHTML = requests.map(function (row) {
      var options = STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (row.status === s ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
      return '' +
        '<tr data-id="' + row.id + '">' +
          '<td class="col-date">' + fmtDate(row.requested_at) + '</td>' +
          '<td class="col-email">' + escapeHtml(row.email) + '</td>' +
          '<td class="col-notes">' + renderNotes(row) + '</td>' +
          '<td>' + escapeHtml(row.location) + '</td>' +
          '<td>' +
            '<select class="status-select">' + options + '</select>' +
            '<span class="save-flash"></span>' +
          '</td>' +
        '</tr>';
    }).join('');
  }

  function loadRequests() {
    statusLine.textContent = 'Loading…';
    fetch('/api/admin-list-advisor-requests', { headers: { 'X-Admin-Password': pw } })
      .then(function (res) {
        if (res.status === 401) throw new Error('unauthorized');
        return res.json();
      })
      .then(function (data) {
        if (!data.ok) throw new Error('server_error');
        renderRows(data.requests);
        statusLine.textContent = data.requests.length + ' request' + (data.requests.length === 1 ? '' : 's') + '.';
      })
      .catch(function (err) {
        if (err.message === 'unauthorized') {
          showLogin('That password isn\'t right anymore. Try again.');
          return;
        }
        statusLine.textContent = 'Something went wrong loading requests. Try refresh.';
      });
  }

  function showLogin(message) {
    try { sessionStorage.removeItem('mm_admin_pw'); } catch (e) {}
    pw = '';
    app.style.display = 'none';
    loginPanel.style.display = 'block';
    loginError.textContent = message || '';
  }

  function showApp() {
    loginPanel.style.display = 'none';
    app.style.display = 'block';
    loadRequests();
  }

  document.getElementById('login-btn').addEventListener('click', function () {
    var entered = document.getElementById('admin-password').value;
    if (!entered) return;
    pw = entered;
    // Verify by attempting a real load — no separate login endpoint needed.
    fetch('/api/admin-list-advisor-requests', { headers: { 'X-Admin-Password': pw } })
      .then(function (res) {
        if (res.status === 401) {
          loginError.textContent = 'Wrong password.';
          return;
        }
        return res.json().then(function (data) {
          if (!data.ok) { loginError.textContent = 'Something went wrong. Try again.'; return; }
          try { sessionStorage.setItem('mm_admin_pw', pw); } catch (e) {}
          renderRows(data.requests);
          statusLine.textContent = data.requests.length + ' request' + (data.requests.length === 1 ? '' : 's') + '.';
          showApp();
        });
      })
      .catch(function () {
        loginError.textContent = 'Something went wrong. Try again.';
      });
  });

  document.getElementById('admin-password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('refresh-btn').addEventListener('click', loadRequests);

  rowsEl.addEventListener('change', function (e) {
    var select = e.target.closest('.status-select');
    if (!select) return;
    var tr = select.closest('tr');
    var id = tr.dataset.id;
    var flash = tr.querySelector('.save-flash');
    select.disabled = true;
    flash.textContent = 'Saving…';
    flash.className = 'save-flash';
    fetch('/api/admin-update-advisor-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pw },
      body: JSON.stringify({ id: id, status: select.value }),
    })
      .then(function (res) { return res.json().catch(function () { return {}; }); })
      .then(function (data) {
        select.disabled = false;
        if (!data.ok) {
          flash.textContent = 'Failed to save';
          flash.className = 'save-flash err';
          return;
        }
        flash.textContent = 'Saved';
        flash.className = 'save-flash ok';
        setTimeout(function () { flash.textContent = ''; }, 2000);
      })
      .catch(function () {
        select.disabled = false;
        flash.textContent = 'Failed to save';
        flash.className = 'save-flash err';
      });
  });

  if (pw) {
    showApp();
  }
})();
</script>

</body>
</html>
